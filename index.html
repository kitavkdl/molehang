<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="지루한 시간 동안 알아서 쌓이는 자원을 수거해 배를 키우는 유휴 게임" />
    <title>몰래항</title>
  </head>
  <body>
    <canvas id="stage"></canvas>

    <div id="ui" class="ui">
      <!-- 상단 -->
      <header class="topbar">
        <div class="topbar__left">
          <div class="brand">몰래항</div>
          <button class="title-badge" id="title-badge" type="button">
            <span class="title-badge__name" id="title-name">떠다니는 뗏목</span>
            <span class="title-badge__parts" id="title-parts">파츠 0</span>
          </button>
        </div>
        <button class="chip" id="open-sheet" type="button" aria-haspopup="dialog">
          <span class="chip__dot" aria-hidden="true"></span>
          기록
        </button>
      </header>

      <!-- 자원 -->
      <div class="stock" id="stock">
        <div class="stock__row">
          <span class="stock__amount" id="stock-amount">0</span>
          <span class="stock__cap" id="stock-cap">/ 0</span>
        </div>
        <div class="stock__bar"><div class="stock__fill" id="stock-fill"></div></div>
        <div class="stock__note" id="stock-note">모으는 중…</div>
      </div>

      <!-- 토스트 -->
      <div class="toasts" id="toasts" aria-live="polite"></div>

      <!-- 하단: 수거 버튼 하나 -->
      <footer class="dock">
        <button class="collect" id="collect" type="button" disabled>
          <span class="collect__label">수거</span>
          <span class="collect__sub" id="collect-sub">아직 모이는 중</span>
        </button>
      </footer>
    </div>

    <!-- 아래에서 올라오는 시트 -->
    <div class="scrim" id="scrim" hidden></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="항해 기록" hidden>
      <div class="sheet__grip" id="sheet-grip"></div>
      <div class="sheet__head">
        <h2 class="sheet__title">항해 기록</h2>
        <button class="sheet__close" id="close-sheet" type="button" aria-label="닫기">✕</button>
      </div>

      <div class="sheet__scroll">
        <div class="sheet__stats" id="sheet-stats"></div>

        <h3 class="sheet__section">지금 이 배</h3>
        <div class="ship-card">
          <div class="ship-card__name" id="ship-title-name">떠다니는 뗏목</div>
          <div class="ship-card__hint" id="ship-title-hint">시작은 다 이렇다</div>
        </div>
        <ul class="parts" id="parts"></ul>

        <h3 class="sheet__section">칭호 <span class="sheet__count" id="titles-count"></span></h3>
        <ul class="titles" id="titles"></ul>

        <h3 class="sheet__section">수거 기록</h3>
        <ul class="log" id="log"></ul>
        <p class="log__empty" id="log-empty">
          아직 수거한 적이 없어요.<br />수업이 지루해질 때쯤 다시 오세요.
        </p>

        <button class="ghost-btn" id="replay-tutorial" type="button">튜토리얼 다시 보기</button>
      </div>
    </section>

    <!-- 튜토리얼 -->
    <div class="tutorial" id="tutorial" hidden>
      <div class="tutorial__spot" id="tutorial-spot"></div>
      <div class="tutorial__card" id="tutorial-card">
        <div class="tutorial__step" id="tutorial-step">1 / 5</div>
        <h2 class="tutorial__title" id="tutorial-title"></h2>
        <p class="tutorial__body" id="tutorial-body"></p>
        <div class="tutorial__actions">
          <button class="ghost-btn" id="tutorial-skip" type="button">건너뛰기</button>
          <button class="tutorial__next" id="tutorial-next" type="button">다음</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
